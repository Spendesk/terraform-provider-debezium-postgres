# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # terraform-plugin-framework/-go/-testing/-sdk share the tfprotov5/tfprotov6 wire
      # protocol interfaces and must move together, or the build breaks with interface
      # satisfaction errors (e.g. framework bumped without testing -> sdk/v2 mismatch).
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      # Everything else: bundle minor/patch bumps into one PR so they don't pile up.
      # Majors are left out (and therefore opened individually) since they're the ones
      # most likely to need a real fix, same as the auto-merge workflow's cutoff.
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/hashicorp/terraform-plugin-*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      tools-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
